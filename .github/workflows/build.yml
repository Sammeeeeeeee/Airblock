name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual release without a command line: Actions → Build APK → Run workflow,
  # enter a tag like v2.3.1 — the run creates the tag AND the release with APKs.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create from this commit (e.g. v2.3.1); leave empty for a plain build"
        required: false
        default: ""

permissions:
  contents: write      # create releases + upload assets
  id-token: write      # Sigstore signing identity
  attestations: write  # store build provenance attestations

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The release tag this run is producing: from the pushed tag, or from the
      # workflow_dispatch input. Empty = ordinary build, no release steps.
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No committed Gradle wrapper needed — setup-gradle provides the exact version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      # Persistent debug keystore (optional): set repo secret DEBUG_KEYSTORE_B64 to a
      # base64-encoded debug.keystore so every build is signed identically and the app
      # updates in place on the phone instead of requiring uninstall/reinstall.
      # The keystore goes to an EXPLICIT path handed to Gradle via
      # DEBUG_KEYSTORE_FILE (read in app/build.gradle.kts) — restoring
      # ~/.android/debug.keystore was silently ignored by AGP on the runners
      # (v3.1.0/v4.0.0/v4.1 all shipped with different one-off certs).
      # keytool-validating it makes a corrupt secret fail THIS step loudly
      # instead of producing yet another unupdatable APK.
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # tr strips CR/LF a Windows-side `gh secret set` may have smuggled
            # in — GNU base64 hard-fails on them ("invalid input")
            echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/debug.keystore"
            keytool -list -keystore "$RUNNER_TEMP/debug.keystore" \
              -alias androiddebugkey -storepass android
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using persistent debug keystore from secret"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set — this APK is signed with a one-off key generated on this runner. Installing it over an existing install fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE (uninstall/reinstall required). Set the secret to make builds update in place."
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      # Visible signature audit: if this digest ever changes between releases,
      # in-place updates will break — catch it in the log, not on the phone
      - name: Print APK signing certificate
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256|DN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airblock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7

      # ---- Releases (v* tag push, or manual dispatch with release_tag) -----
      - name: Build release APK
        if: env.RELEASE_TAG != ''
        run: gradle assembleRelease

      - name: Rename release assets
        if: env.RELEASE_TAG != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk "airblock-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "airblock-${RELEASE_TAG}-debug.apk"

      # Sigstore-backed build provenance: anyone can verify these APKs were
      # built by THIS workflow from THIS commit:
      #   gh attestation verify airblock-vX.Y.Z.apk --repo Sammeeeeeeee/Airblock
      # Best-effort: GitHub's attestation API intermittently 401s ("Failed to
      # persist attestation: Requires authentication") and that must never
      # block publishing the release APKs themselves (v3.0.0 hit this twice).
      # A release without an attestation simply can't be gh-verified.
      - name: Attest build provenance (Sigstore)
        if: env.RELEASE_TAG != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            airblock-${{ env.RELEASE_TAG }}.apk
            airblock-${{ env.RELEASE_TAG }}-debug.apk

      # Idempotent: a release manually created in the GitHub UI (which is what
      # pushes the tag) must get the APKs attached, not make this step fail.
      # --clobber also lets a re-run replace previously uploaded assets.
      # On dispatch the tag doesn't exist yet — gh creates it at this commit.
      - name: Create GitHub release (or attach APKs to an existing one)
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists — uploading APKs to it"
            gh release upload "$RELEASE_TAG" \
              "airblock-${RELEASE_TAG}.apk" \
              "airblock-${RELEASE_TAG}-debug.apk" \
              --clobber \
              --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" \
              "airblock-${RELEASE_TAG}.apk" \
              "airblock-${RELEASE_TAG}-debug.apk" \
              --title "Airblock $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
