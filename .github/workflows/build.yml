name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # create releases + upload assets
  id-token: write      # Sigstore signing identity
  attestations: write  # store build provenance attestations

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No committed Gradle wrapper needed — setup-gradle provides the exact version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      # Persistent debug keystore (optional): set repo secret DEBUG_KEYSTORE_B64 to a
      # base64-encoded debug.keystore so every build is signed identically and the app
      # updates in place on the phone instead of requiring uninstall/reinstall.
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using persistent debug keystore from secret"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set — this APK is signed with a one-off key generated on this runner. Installing it over an existing install fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE (uninstall/reinstall required). Set the secret to make builds update in place."
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airblock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7

      # ---- Tagged releases (push a v* tag) --------------------------------
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease

      - name: Rename release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "airblock-${{ github.ref_name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "airblock-${{ github.ref_name }}-debug.apk"

      # Sigstore-backed build provenance: anyone can verify these APKs were
      # built by THIS workflow from THIS commit:
      #   gh attestation verify airblock-vX.Y.Z.apk --repo Sammeeeeeeee/Airblock
      - name: Attest build provenance (Sigstore)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            airblock-${{ github.ref_name }}.apk
            airblock-${{ github.ref_name }}-debug.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "airblock-${{ github.ref_name }}.apk" \
            "airblock-${{ github.ref_name }}-debug.apk" \
            --title "Airblock ${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
